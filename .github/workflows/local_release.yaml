name: Anarlog Local release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version committed in tauri.conf.local-ai.json
        required: true
        default: "0.1.0"
        type: string
      publish:
        description: Publish verified files to an experimental GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: anarlog-local-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.fork
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.94.0"
          components: rustfmt,clippy
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const actual = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.local-ai.json")).version;
            if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION) || actual !== process.env.RELEASE_VERSION) process.exit(1);
          '
      - run: pnpm install --frozen-lockfile
      - name: Prepare Metal compiler
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Verify release guards
        run: |
          node --test scripts/local-build-environment.test.mjs scripts/verify-local-artifact.test.mjs scripts/audit-local-source-history.test.mjs
          python3 -m unittest discover -s scripts -p test_package_local_release.py
          python3 .github/scripts/test_check_license_boundary.py
          python3 .github/scripts/check_license_boundary.py
      - name: Build isolated Local application
        env:
          ANARLOG_DISABLE_SENTRY: "1"
        run: node scripts/build-local-ai.mjs --build
      - name: Package verified application and matching sources
        run: python3 scripts/package-local-release.py target/local-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anarlog-local-release
          path: target/local-release/
          if-no-files-found: error
          retention-days: 3

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anarlog-local-release
          path: release-files
      - name: Verify exact upload set and checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/package-local-release.py release-files --verify --sha "$SOURCE_SHA" --version "$RELEASE_VERSION"
      - name: Publish immutable experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="local-v$RELEASE_VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists; select a new version."
            exit 1
          fi
          gh release create "$tag" --target "$SOURCE_SHA" \
            --title "Anarlog Local $RELEASE_VERSION — Apple Silicon" \
            --prerelease --notes-file release-files/release-notes.md \
            release-files/*.dmg release-files/*.tar.gz release-files/THIRD_PARTY_NOTICES.txt \
            release-files/SHA256SUMS release-files/release.json
